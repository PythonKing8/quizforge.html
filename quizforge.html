<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizForge — AI Topic Quizzer</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#080b14;color:#f4f6ff;min-height:100vh;
}
.app{max-width:1050px;margin:auto;padding:36px 20px 60px}
header{text-align:center;margin-bottom:28px}
.badge{display:inline-block;padding:7px 12px;border:1px solid #30374c;border-radius:999px;color:#aeb9d9;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:clamp(38px,7vw,68px);line-height:.95;margin:18px 0 12px;letter-spacing:-.05em}
.gradient{background:linear-gradient(90deg,#8ea2ff,#d28cff,#72e8dc);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{color:#98a2bc;font-size:16px;margin:0}
.panel{
  background:#101522;border:1px solid #252d40;border-radius:22px;padding:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.25)
}
.controls{display:grid;grid-template-columns:1fr auto auto;gap:12px}
input,select,button{
  border-radius:13px;border:1px solid #30394f;background:#0b0f19;color:#f5f7ff;
  padding:13px 15px;font-size:15px;outline:none
}
input:focus,select:focus{border-color:#7184ff;box-shadow:0 0 0 3px rgba(113,132,255,.12)}
button{cursor:pointer;font-weight:700;background:#7184ff;border-color:#7184ff}
button:hover{filter:brightness(1.1)}
.secondary{background:#171d2b;border-color:#30394f}
.options{display:flex;gap:10px;flex-wrap:wrap;margin-top:13px}
.options label{color:#aeb7cd;font-size:13px;display:flex;align-items:center;gap:7px}
.quiz-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:28px 0 15px}
.topic-title{font-size:21px;font-weight:800}
.score{color:#aeb9d9;font-size:14px}
.question{
  background:#0d121e;border:1px solid #283146;border-radius:18px;padding:20px;margin:13px 0;
}
.qnum{color:#8492b8;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.qtext{font-size:18px;font-weight:750;line-height:1.4;margin:8px 0 15px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answer{
  text-align:left;background:#141a28;border:1px solid #30394f;font-weight:600;color:#dfe4f2;
}
.answer.correct{border-color:#4fcd98;background:#10271f}
.answer.wrong{border-color:#ef7180;background:#29151b}
.answer.disabled{cursor:default}
.explanation{display:none;color:#aeb7cd;font-size:13px;margin-top:12px;line-height:1.5}
.explanation.show{display:block}
.status{padding:16px;text-align:center;color:#aeb7cd}
.hidden{display:none}
.footer{text-align:center;color:#66718a;font-size:12px;margin-top:20px}
@media(max-width:700px){
 .controls{grid-template-columns:1fr}
 .answers{grid-template-columns:1fr}
 .quiz-head{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<div class="app">
<header>
  <span class="badge">Study mode</span>
  <h1><span class="gradient">QuizForge</span></h1>
  <p class="subtitle">Enter any topic. Generate a fresh MCQ quiz. Switch topics whenever you want.</p>
</header>

<section class="panel">
  <div class="controls">
    <input id="topic" placeholder="e.g. IGCSE Physics — Forces" value="IGCSE Physics — Forces">
    <select id="count">
      <option value="5">5 questions</option>
      <option value="10" selected>10 questions</option>
      <option value="15">15 questions</option>
    </select>
    <button onclick="generateQuiz()">Generate Quiz</button>
  </div>
  <div class="options">
    <label><input type="checkbox" id="hard"> Challenge mode</label>
    <label><input type="checkbox" id="explain" checked> Show explanations</label>
  </div>
</section>

<div id="quizArea" class="hidden">
  <div class="quiz-head">
    <div class="topic-title" id="quizTitle"></div>
    <div class="score" id="score">0 / 0</div>
  </div>
  <div id="questions"></div>
  <button class="secondary" onclick="generateQuiz()">↻ Generate new questions</button>
</div>

<div id="status" class="status">Enter a topic above and generate your first quiz.</div>
<div class="footer">Local demo • No account required • Questions are generated from built-in topic banks</div>
</div>

<script>
const banks = {
 physics: [
  ["A car accelerates from rest at 3 m/s² for 4 s. What is its final velocity?","12 m/s","7 m/s","1.33 m/s","24 m/s",0,"v = u + at = 0 + (3)(4) = 12 m/s."],
  ["Which quantity is a vector?","Speed","Distance","Velocity","Mass",2,"Velocity has both magnitude and direction."],
  ["What is the resultant force on a 6 kg object accelerating at 2 m/s²?","3 N","8 N","12 N","18 N",2,"F = ma = 6 × 2 = 12 N."],
  ["An object moves at constant velocity. What is the resultant force?","0 N","Its weight","Its mass","It depends on its speed",0,"Constant velocity means zero acceleration, so resultant force is zero."],
  ["Which graph has a gradient equal to acceleration?","Distance-time","Velocity-time","Mass-time","Force-time",1,"The gradient of a velocity-time graph gives acceleration."],
  ["A 2 kg object has a weight of about 19.6 N on Earth. What is g?","4.9 N/kg","9.8 N/kg","19.6 N/kg","39.2 N/kg",1,"g = W/m = 19.6/2 = 9.8 N/kg."],
  ["What happens to momentum if velocity doubles while mass stays constant?","It halves","It stays the same","It doubles","It becomes zero",2,"p = mv, so doubling v doubles p."],
  ["Which force usually opposes motion between two touching surfaces?","Tension","Friction","Upthrust","Weight",1,"Friction acts to oppose relative motion between surfaces."],
  ["A falling object reaches terminal velocity. What is true?","Acceleration is maximum","Resultant force is zero","Weight is zero","Air resistance is zero",1,"At terminal velocity, air resistance balances weight."],
  ["Newton's third law says forces occur in...","pairs equal in size and opposite in direction","pairs acting on the same object","groups of three","pairs with equal acceleration",0,"Action-reaction forces are equal and opposite and act on different objects."]
 ],
 chemistry: [
  ["Which particle has a negative charge?","Proton","Neutron","Electron","Nucleus",2,"Electrons carry negative charge."],
  ["An element has atomic number 8. How many protons does it have?","4","8","16","10",1,"Atomic number equals the number of protons."],
  ["What is the electronic configuration of sodium (11)?","2,8,1","2,7,2","8,3","2,9",0,"Sodium has 11 electrons: 2 in the first shell, 8 in the second and 1 in the third."],
  ["Which structure consists of positive ions surrounded by delocalised electrons?","Simple molecular","Giant ionic","Metallic","Giant covalent",2,"Metallic bonding involves positive metal ions and delocalised electrons."],
  ["What happens to particles when a substance is heated?","They always become smaller","Their average kinetic energy increases","They disappear","Their mass increases",1,"Heating increases the particles' average kinetic energy."],
  ["Which substance is most likely to have a low melting point?","Diamond","Sodium chloride","Carbon dioxide","Copper",2,"Carbon dioxide is a simple molecular substance with weak intermolecular forces."],
  ["What is the charge on an oxide ion?","+1","-1","+2","-2",3,"Oxygen gains two electrons to form O²⁻."],
  ["Which test gives a white precipitate with chloride ions?","Silver nitrate","Limewater","Iodine","Benedict's solution",0,"Acidified silver nitrate forms a white precipitate with chloride ions."],
  ["Which group contains noble gases?","Group 1","Group 2","Group 17","Group 18",3,"Noble gases are in Group 18."],
  ["Why do ionic compounds conduct electricity when molten?","Their atoms become larger","Their ions are free to move","They contain electrons in shells","They melt into metals",1,"Molten ionic compounds have mobile ions that carry charge."]
 ],
 biology: [
  ["Which organelle is the main site of aerobic respiration?","Ribosome","Nucleus","Mitochondrion","Cell wall",2,"Mitochondria are the main site of aerobic respiration."],
  ["What is osmosis?","Movement of glucose using energy","Movement of water through a partially permeable membrane","Movement of proteins out of cells","Breakdown of starch",1,"Osmosis is the net movement of water through a partially permeable membrane from higher to lower water potential."],
  ["Which substance is used to test for starch?","Benedict's solution","Iodine solution","Biuret solution","Ethanol",1,"Iodine turns blue-black when starch is present."],
  ["What is the role of an enzyme?","It increases activation energy","It is used up in reactions","It catalyses a reaction","It provides genetic information",2,"Enzymes are biological catalysts and are not used up by the reaction."],
  ["Which molecule carries genetic information?","Starch","DNA","Glucose","Glycerol",1,"DNA stores genetic information."],
  ["Where are ribosomes found?","Only in the nucleus","In the cytoplasm and on rough ER","Only in mitochondria","Only in cell walls",1,"Ribosomes are found free in cytoplasm or attached to rough ER."],
  ["A plant cell placed in a very dilute solution is likely to...","gain water and become turgid","lose water and become plasmolysed","lose all its solutes","stop having a cell wall",0,"Water enters by osmosis and the cell becomes turgid."],
  ["Which test is used for protein?","Biuret","Iodine","Benedict's","DCPIP",0,"Biuret reagent gives a purple/lilac result with protein."],
  ["What is the function of chlorophyll?","Absorb light energy","Digest proteins","Transport water","Make enzymes",0,"Chlorophyll absorbs light energy for photosynthesis."],
  ["Why do enzymes stop working at very high temperatures?","They evaporate","Their active site changes shape","They turn into carbohydrates","They gain extra substrates",1,"High temperatures can denature enzymes, changing the active site."]
 ],
 math: [
  ["What is the HCF of 24 and 36?","6","12","18","24",1,"The highest common factor is 12."],
  ["What is 5.6 × 10⁵?","56,000","560,000","5,600,000","56",1,"Move the decimal 5 places right: 560,000."],
  ["If y = 3x + 2, what is y when x = 5?","10","15","17","20",2,"y = 3(5) + 2 = 17."],
  ["What is the gradient of y = -2x + 7?","7","2","-2","-7",2,"In y = mx + c, m is the gradient."],
  ["A number is rounded to the nearest 10 and becomes 340. What is its lower bound?","330","335","339","340",1,"The lower bound is 335 because values from 335 up to but not including 345 round to 340."],
  ["What is 3/4 ÷ 1/2?","3/8","1/2","3/2","2",2,"Dividing by 1/2 is multiplying by 2: 3/4 × 2 = 3/2."],
  ["If x² = 49 and x is positive, x = ?","-7","0","7","14",2,"The positive square root of 49 is 7."],
  ["What is the nth term of 4, 7, 10, 13...?","3n","3n + 1","4n - 1","n + 3",1,"The sequence increases by 3 and the formula 3n + 1 gives 4,7,10,13."],
  ["A rectangle has area 48 cm² and width 6 cm. What is its length?","6 cm","8 cm","12 cm","42 cm",1,"Length = area ÷ width = 48 ÷ 6 = 8 cm."],
  ["What is 2³ × 2⁴?","2⁷","4⁷","2¹²","2¹",0,"When multiplying powers with the same base, add the indices: 3 + 4 = 7."]
 ],
 economics: [
  ["What is opportunity cost?","The total money spent","The next best alternative forgone","The profit made","A government tax",1,"Opportunity cost is the benefit of the next best alternative given up."],
  ["Which is a factor of production?","Scarcity","Capital","Demand","Inflation",1,"The four factors are land, labour, capital and enterprise."],
  ["What is the reward for labour?","Rent","Interest","Wages","Profit",2,"Labour is rewarded with wages."],
  ["If demand increases and supply stays constant, price will generally...","fall","rise","become zero","stay fixed",1,"Higher demand with unchanged supply creates upward pressure on price."],
  ["What does scarcity mean?","Resources are unlimited","Resources are limited relative to wants","Prices are always high","There is no choice",1,"Scarcity exists because resources are limited while human wants are unlimited."],
  ["Which is a renewable resource?","Coal","Natural gas","Solar energy","Crude oil",2,"Solar energy is naturally replenished."],
  ["What is the basic economic problem caused by scarcity?","Unlimited resources","Choice","Perfect competition","Free goods",1,"Scarcity forces people and firms to make choices."],
  ["A subsidy to producers usually causes supply to...","decrease","increase","become perfectly inelastic","disappear",1,"A subsidy lowers production costs and can increase supply."],
  ["What is inflation?","A fall in all prices","A sustained rise in the general price level","A rise in unemployment only","A fall in output only",1,"Inflation is a sustained increase in the general price level."],
  ["What does a production possibility curve show?","Only consumer demand","Maximum possible combinations of two goods","Only government spending","Individual preferences",1,"A PPC shows possible maximum combinations of two goods given available resources and technology."]
 ],
 english: [
  ["Which word is most clearly emotive?","large","building","terrifying","object",2,"'Terrifying' is emotive because it is chosen to create a strong emotional response."],
  ["Which statement is a fact?","The film is amazing.","The city is the best place to visit.","Water boils at about 100°C at standard atmospheric pressure.","Everyone loves football.",2,"This can be objectively tested rather than depending on opinion."],
  ["What does a rhetorical question often do?","Provide a calculation","Engage the reader or make them consider an idea","Give a dictionary definition","End a paragraph automatically",1,"Rhetorical questions can directly involve the reader."],
  ["Which phrase uses personification?","The blue car","The wind whispered through the trees","Three kilometres","A wooden door",1,"The wind is given the human ability to whisper."],
  ["What is the purpose of a headline?","Hide the topic","Immediately attract attention and indicate the subject","Replace every paragraph","Give references",1,"A headline quickly signals the topic and can attract the reader."],
  ["Which is most suitable for a formal letter?","Yo what's up","I am writing to express my concern regarding...","That thing was super weird","LOL this was bad",1,"Formal writing uses polite and appropriate language."],
  ["What does bias mean?","Complete neutrality","A preference or viewpoint that affects how something is presented","A spelling mistake","A quotation",1,"Bias means a leaning toward a particular viewpoint."],
  ["A writer repeatedly uses words such as 'unfortunately' and 'wasteful'. Their attitude is most likely...","positive","critical","uncertain","celebratory",1,"Those words suggest disapproval or criticism."],
  ["What is a counterargument?","A supporting example","An opposing point of view","A title","A conclusion only",1,"A counterargument presents a different or opposing view."],
  ["Which structure is most useful for an interview?","Questions and responses","Only a list of statistics","Only one long paragraph","A bibliography only",0,"Interviews are normally structured through questions and responses."]
 ]
};

function chooseBank(topic){
 const t=topic.toLowerCase();
 if(t.includes("physics")||t.includes("force")||t.includes("motion")||t.includes("momentum")) return banks.physics;
 if(t.includes("chem")||t.includes("atom")||t.includes("bond")||t.includes("periodic")) return banks.chemistry;
 if(t.includes("bio")||t.includes("cell")||t.includes("enzyme")||t.includes("osmosis")) return banks.biology;
 if(t.includes("math")||t.includes("algebra")||t.includes("number")||t.includes("bound")) return banks.math;
 if(t.includes("econ")||t.includes("scarcity")||t.includes("demand")||t.includes("supply")) return banks.economics;
 if(t.includes("english")||t.includes("writing")||t.includes("language")||t.includes("comprehension")) return banks.english;
 return [...banks.physics,...banks.chemistry,...banks.biology,...banks.math,...banks.economics,...banks.english];
}
let current=[], answered=0, score=0;

function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
function generateQuiz(){
 const topic=document.getElementById("topic").value.trim()||"General Knowledge";
 const n=+document.getElementById("count").value;
 let pool=chooseBank(topic);
 current=shuffle(pool).slice(0,Math.min(n,pool.length));
 answered=0;score=0;
 document.getElementById("quizArea").classList.remove("hidden");
 document.getElementById("status").classList.add("hidden");
 document.getElementById("quizTitle").textContent=topic;
 render();
}
function render(){
 const wrap=document.getElementById("questions");
 wrap.innerHTML="";
 current.forEach((q,i)=>{
  const card=document.createElement("div"); card.className="question";
  const labels=["A","B","C","D"];
  card.innerHTML=`<div class="qnum">Question ${i+1}</div><div class="qtext">${q[0]}</div>
  <div class="answers">${q.slice(1,5).map((a,j)=>`<button class="answer" onclick="answer(${i},${j},this)"><b>${labels[j]}.</b> ${a}</button>`).join("")}</div>
  <div class="explanation" id="exp${i}">${q[6]}</div>`;
  wrap.appendChild(card);
 });
 updateScore();
}
function answer(i,j,btn){
 const card=btn.closest(".question");
 if(card.dataset.done)return;
 card.dataset.done="1";answered++;
 const buttons=card.querySelectorAll(".answer");
 buttons.forEach((b,k)=>{b.classList.add("disabled");b.disabled=true;if(k===current[i][5])b.classList.add("correct")});
 if(j===current[i][5])score++; else btn.classList.add("wrong");
 if(document.getElementById("explain").checked)card.querySelector(".explanation").classList.add("show");
 updateScore();
}
function updateScore(){document.getElementById("score").textContent=`${score} / ${current.length} answered: ${answered}`;}
</script>
</body>
</html>
